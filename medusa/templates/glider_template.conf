verbose=True
listen=:1080

# Read-only status endpoint: how many forwarders are in each group's dial
# rotation, versus how many are configured. Prometheus text on /metrics, JSON on
# /state, liveness on /healthz. A bare port binds 127.0.0.1 — unlike listen=,
# which binds every interface — and the payload never includes a forwarder URL,
# since those carry the upstream credential. It is bind-time: a reload warns and
# ignores a change here, so moving it needs a restart.
admin=1090

strategy=rr
check=https://api.binance.com/api/v3/ping#expect=200
# checkinterval is not simply "how often a healthy forwarder is rechecked".
# After a failed check it is multiplied by an exponential backoff (capped at
# 16x) and only a SUCCESS resets it, so at 260s a forwarder that failed a few
# times could go unretried for up to 16*260s = 69 minutes — a pool that dips
# then stays down long after the upstream itself has recovered. At 60s the same
# backoff caps at 16 minutes and the first retry is a minute out. The cost is
# one weight-1 request per forwarder per minute.
checkinterval=60
# maxfailures counts REAL traffic failures too, not just health checks. At 1, a
# single TCP hiccup parks a forwarder until its next successful check — which
# the backoff above can push a long way out. 3 (glider's own default) absorbs
# transient blips and leaves the recheck cadence to handle the rest.
maxfailures=3

# A failed dial retries on the NEXT forwarder instead of returning 502 to the
# caller, so one flaky upstream in a large pool does not surface downstream.
# Each failed attempt is still charged to the forwarder it happened on, so
# maxfailures above sees more of the truth, not less.
dialattempts=3
# Wall-clock bound on those retries. A dial already in flight cannot be aborted
# (the dialer interface takes no context, and some protocols add a handshake
# timeout of their own on top of dialtimeout), so this governs whether ANOTHER
# attempt may start, and it requires room for one as slow as the last. Keep it
# below the dial timeout of whatever client sits in front of glider: overshooting
# does not avoid failures, it trades a fast error for a slow timeout.
dialbudget=8

dnsserver=1.1.1.1:53
dnsserver=223.5.5.5:53
dnsserver=119.29.29.29:53
dnsserver=8.8.8.8:53
# timeout value used in multiple dnsservers switch(seconds)
dnstimeout=4
# maximum TTL value for entries in the CACHE(seconds)
dnsmaxttl=1800
# minimum TTL value for entries in the CACHE(seconds)
dnsminttl=0
# size of CACHE
dnscachesize=4096
# show query log of dns cache
dnscachelog=True

dns=:1053